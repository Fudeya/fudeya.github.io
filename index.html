<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>Arcaea報告用</title>

<style>

body{
font-family:sans-serif;
display:flex;
flex-direction:column;
align-items:center;
background:linear-gradient(to right,#4facfe,#f093fb);
height:200vh;
margin:0;
color:#fff;
}

h1,p{
text-align:center;
margin:20px;
}

.container{
display:flex;
gap:20px;
margin-top:40px;
justify-content:center;
}

/* 按鈕 */

.box{
width:100px;
height:100px;
border:2px solid #fff;
display:flex;
justify-content:center;
align-items:center;
cursor:pointer;
background:rgba(255,255,255,0.2);
border-radius:10px;
transition:transform 0.2s ease;
}

.box img{
width:100%;
height:100%;
object-fit:cover;
}


/* 輸出句子 */

#result{
margin-top:40px;
font-size:22px;
background:rgba(255,255,255,0.15);
padding:15px 25px;
border-radius:10px;
}

</style>
</head>

<body>

<h1>點擊抽取光或對立</h1>
<p>⬇️</p>

  

<!-- 抽取按鈕 -->
/* <div class="container"> */

/*<img src="無標題120_20260518041924.png">*/
</div>
</div>

<!-- 輸出 -->
<div id="result">等待抽取...</div>

<script>

const touchBox=document.getElementById("touchBox")

const inputA=document.getElementById("inputA")
const inputB=document.getElementById("inputB")

const result=document.getElementById("result")

function pickRandom(){

const random=Math.floor(Math.random()*2)

const nameA=inputA.value || "A"
const nameB=inputB.value || "B"

if(random===1){

result.textContent=`光是1， 對立是0`

}else{

result.textContent=`對立是1， 光是1`

}

}

touchBox.addEventListener("click",()=>{

touchBox.style.transform="scale(0.9)"

setTimeout(()=>{

touchBox.style.transform="scale(1)"

pickRandom()

},100)

})

</script>

</body>
</html>
