<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>Arcaea報告用</title>

    <style>
    /* 保留您原本的精美漸層背景與基本樣式 */
    body {
        font-family: sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        background: linear-gradient(to right, #4facfe, #f093fb);
        height: 100vh; /* 調整為 100vh 讓視覺更集中 */
        margin: 0;
        color: #fff;
    }

    h1, p {
        text-align: center;
        margin: 20px;
    }

    .container {
        display: flex;
        gap: 20px;
        margin-top: 40px;
        justify-content: center;
    }

    /* 您原本的圖片按鈕樣式 */
    .box {
        width: 100px;
        height: 100px;
        border: 2px solid #fff;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 10px;
        transition: transform 0.2s ease;
    }

    .box:hover {
        transform: scale(1.05); /* 加上小動畫，滑鼠懸停時放大 */
    }

    .box img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 8px;
    }

    /* 您原本的輸出框樣式 */
    #result {
        margin-top: 40px;
        font-size: 22px;
        background: rgba(255, 255, 255, 0.15);
        padding: 15px 25px;
        border-radius: 10px;
        min-height: 30px;
    }
    </style> <!-- 【修正 1】正確閉合 style 標籤 -->
</head>
<body>

    <h1>Arcaea 報告工具</h1>
    <p>請點擊下方搭檔（或圖片）查看詳細資訊</p>

    <!-- 【修正 2】補上按鈕與圖片的 HTML 容器（請自行替換 img 的 src 圖片路徑） -->
    <div class="container">
        <div class="box" onclick="showReport('光 (Hikari) 是 Arcaea 的主角之一，擁有平衡型的技能。')">
            <img src="https://placehold.co/100" alt="光">
        </div>
        <div class="box" onclick="showReport('對立 (Tairitsu) 是 Arcaea 的另一位主角，技能通常與挑戰或「溢出」相關。')">
            <img src="https://placehold.co/100" alt="對立">
        </div>
        <div class="box" onclick="showReport('這裡可以寫第三個搭檔或報告的介紹內容。')">
            <img src="https://placehold.co/100" alt="搭檔3">
        </div>
    </div>

    <!-- 【修正 3】補上用來顯示結果的 div -->
    <div id="result">點擊上方方塊顯示報告內容...</div>

    <!-- 【修正 4】補上控制點擊效果的 JavaScript -->
    <script>
        function showReport(text) {
            document.getElementById('result').innerText = text;
        }
    </script>

</body>
</html>
