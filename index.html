<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>Arcaea報告用</title>

<style>
/* 保留您原本的精美漸層背景與基本樣式 */
body {
    font-family: sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: linear-gradient(to right, #4facfe, #f093fb);
    height: 100vh; /* 調整為 100vh 讓視覺更集中 */
    margin: 0;
    color: #fff;
}

h1, p {
    text-align: center;
    margin: 20px;
}

.container {
    display: flex;
    gap: 20px;
    margin-top: 40px;
    justify-content: center;
}

/* 您原本的圖片按鈕樣式 */
.box {
    width: 100px;
    height: 100px;
    border: 2px solid #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    background: rgba(255, 255, 255, 0.2);
    border-radius: 10px;
    transition: transform 0.2s ease;
}

.box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 8px;
}

/* 您原本的輸出框樣式 */
#result {
    margin-top: 40px;
    font-size: 22px;
    background: rgba(255, 255, 255, 0.15);
    padding: 15px 25px;
    border-radius: 10px;
}


</script>

</body>
</html>
