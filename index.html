<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>01抽取器</title>

<style>

body{
font-family:sans-serif;
display:flex;
flex-direction:column;
align-items:center;
background:linear-gradient(to right,#4facfe,#f093fb);
height:200vh;
margin:0;
color:#fff;
}

h1,p{
text-align:center;
margin:20px;
}

.container{
display:flex;
gap:20px;
margin-top:40px;
justify-content:center;
}

/* 按鈕 */

.box{
width:100px;
height:100px;
border:2px solid #fff;
display:flex;
justify-content:center;
align-items:center;
cursor:pointer;
background:rgba(255,255,255,0.2);
border-radius:10px;
transition:transform 0.2s ease;
}

.box img{
width:100%;
height:100%;
object-fit:cover;
}

/* 輸入框 */

.inputs{
margin-top:30px;
display:flex;
gap:10px;
}

input{
padding:10px;
border-radius:8px;
border:none;
width:120px;
text-align:center;
}

/* 輸出句子 */

#result{
margin-top:40px;
font-size:22px;
background:rgba(255,255,255,0.15);
padding:15px 25px;
border-radius:10px;
}

</style>
</head>

<body>

<h1>誰是1？</h1>
<p>⬇️</p>

<!-- 輸入 -->
<div class="inputs">
<input id="inputA" placeholder="nameA (1)">
<input id="inputB" placeholder="nameB (0)">
</div>

<!-- 抽取按鈕 -->
<div class="container">
<div class="box" id="touchBox">
<img src="1touch.png">
</div>
</div>

<!-- 輸出 -->
<div id="result">等待抽取...</div>

<script>

const touchBox=document.getElementById("touchBox")

const inputA=document.getElementById("inputA")
const inputB=document.getElementById("inputB")

const result=document.getElementById("result")

function pickRandom(){

const random=Math.floor(Math.random()*2)

const nameA=inputA.value || "A"
const nameB=inputB.value || "B"

if(random===1){

result.textContent=`${nameA}是1， ${nameB}是0`

}else{

result.textContent=`${nameA}是0， ${nameB}是1`

}

}

touchBox.addEventListener("click",()=>{

touchBox.style.transform="scale(0.9)"

setTimeout(()=>{

touchBox.style.transform="scale(1)"

pickRandom()

},100)

})

</script>

</body>
</html>
